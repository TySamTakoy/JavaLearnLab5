databaseChangeLog:
  - changeSet:
      id: create-order-items-table
      author: TySamTakoy
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: order_id
                  type: int
                  constraints:
                    foreignKeyName: fk_order_items_order
                    references: order(id)
              - column:
                  name: product_id
                  type: int
                  constraints:
                    foreignKeyName: fk_order_items_product
                    references: products(id)
              - column:
                  name: price
                  type: numeric
      rollback:
        - dropTable:
            tableName: order_items