databaseChangeLog:
  - changeSet:
      id: create-carts-table
      author: TySamTakoy
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: user_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: fk_carts_user
              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_carts_product
        - addForeignKeyConstraint:
            baseTableName: carts
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_carts_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: carts
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_carts_product
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: carts