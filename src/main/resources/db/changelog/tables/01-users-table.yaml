databaseChangeLog:
  - changeSet:
      id: create-users-table
      author: TySamTakoy
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: varchar(255)
              - column:
                  name: password_hash
                  type: varchar(255)
      rollback:
        - dropTable:
            tableName: users